name: MCP checks
on:
  pull_request:
    paths:
      - 'src/mcp/**'
      - 'src/lib/**'
      - 'scripts/*mcp*.mjs'
      - 'src/app/api/applications/**'
      - 'src/app/api/notebook/**'
      - 'src/app/api/reviews/**'
      - 'src/app/api/intros/**'
      - 'src/app/api/tools/jd-portraits/**'
      - 'examples/mcp/**'
      - 'docs/MCP.md'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vitest*.mts'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:mcp
      - run: >-
          npx vitest run src/lib/__tests__/database-schema.test.ts
          src/lib/__tests__/backup-fixture-versions.integration.test.ts
          src/lib/__tests__/notebook-notes-backup.integration.test.ts
          src/lib/__tests__/application-interview-review.integration.test.ts
          src/lib/__tests__/notebook-favorite.test.ts src/lib/__tests__/reviews.integration.test.ts
          src/lib/__tests__/docs-capability-contract.test.ts
      - run: npm run example:mcp
      - run: npm run typecheck
